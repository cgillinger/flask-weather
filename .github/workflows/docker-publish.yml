# Builds the Docker image and publishes it to GitHub Container Registry
# (ghcr.io/cgillinger/flask-weather) so anyone can point Synology Container
# Manager — or plain `docker compose up -d` — at a ready-made image instead of
# building it themselves.
#
# Triggers:
#   - push to main          → :latest
#   - version tag (vX.Y.Z)  → :X.Y.Z and :X.Y
#
# Multi-arch (amd64 + arm64) so Intel NAS boxes, ARM NAS boxes and Raspberry Pi
# all work. arm64 builds run under QEMU; nothing is compiled from source
# (netCDF4/numpy ship aarch64 wheels), so it stays reasonably quick.

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only verify that the image still builds — no push, and
      # amd64 only to keep PR feedback fast.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
